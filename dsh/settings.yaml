# dsh profile settings — hot-reloaded by dsh-settings-file.
# The official deepseek-official route remains mounted by dsh-base.
llm-commandcode:
  apiKeyEnv: COMMANDCODE_API_KEY
  apiBase: https://api.commandcode.ai

agent-default-model:
  provider: commandcode
  model: deepseek/deepseek-v4-flash
  reasoningEffort: high

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1

# OpenCode Zen (opencode-zen) via the pi-ai multi-provider adapter (dsh-llm-pi-ai).
# Hand-declared route: pi-ai's bundled opencode catalog is stale and omits
# hy3-free / nemotron-3.5-lightning-free, so the free-model set is spelled out.
# apiKeyEnv resolves OPENCODE_API_KEY from $DSH_HOME/.credentials.yaml.
llm-pi-ai:
  providers:
    opencode-zen:
      displayName: OpenCode Zen
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-completions
      baseURL: https://opencode.ai/zen/v1
      models:
        - id: deepseek-v4-flash-free
          name: DeepSeek V4 Flash Free
          contextWindow: 262144
          maxTokens: 32768
          input: [ text ]
          reasoningEfforts:
            off: null
            high: high
        - id: hy3-free
          name: HY3 Free
          contextWindow: 262144
          maxTokens: 32768
          input: [ text ]
          reasoningEfforts:
            off: null
            high: high
        - id: laguna-s-2.1-free
          name: Laguna S 2.1 Free
          contextWindow: 262144
          maxTokens: 32768
          input: [ text ]
          reasoningEfforts:
            off: null
            high: high
        - id: mimo-v2.5-free
          name: Mimo V2.5 Free
          contextWindow: 262144
          maxTokens: 32768
          input: [ text ]
          reasoningEfforts:
            off: null
            high: high
        - id: nemotron-3.5-lightning-free
          name: Nemotron 3.5 Lightning Free
          contextWindow: 262144
          maxTokens: 32768
          input: [ text ]
          reasoningEfforts:
            off: null
            high: high
        - id: nemotron-3-ultra-free
          name: Nemotron 3 Ultra Free
          contextWindow: 262144
          maxTokens: 32768
          input: [ text ]
          reasoningEfforts:
            off: null
            high: high
    bitdeer-ai:
