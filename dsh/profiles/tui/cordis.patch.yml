







- id: llm-newapi
  config:



    label: OpenCode Go
    baseURL: https://opencode.ai/zen/go
    apiKeyEnv: OPENCODE_GO_API_KEY
    flavor: openai-compatible
    catalogMode: auto




    retryPolicy:
      mode: normal
      maxRetries: 5
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT]
      backoff:
        initialDelayMs: 1000
        maxDelayMs: 30000
        jitterRatio: 0.1
    gateways:
      - id: bai
        label: B.AI
        baseURL: https://api.b.ai
        apiKeyEnv: BAI_API_KEY
        flavor: newapi
        catalogMode: auto






- id: working-activity
  config:
    publish: false
    publishIntervalMs: 500






- insert:
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0




- id: dsh-super-injector
  config:
    profileNodeModules: !!js dshHomePath('profiles/tui/node_modules')


- id: dsh-tui
  config:
    provider: openrouter
    model: stealth/ox-alpha
    reasoning: max




- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'



- insert:
    - id: pstack
      name: '@wayanjimmy/dsh-pstack'








- id: dsh-tui-auth
  config:
    providers: [anthropic, xai]
